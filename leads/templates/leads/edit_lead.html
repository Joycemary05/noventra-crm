<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Lead - LeadFlow CRM</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f3f8;
    color:#333;
}

.container{
    width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h1{
    color:#6b4c8a;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

button,
a{
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button{
    background:#6b4c8a;
    color:white;
}

.cancel{
    background:#ddd;
    color:#333;
}

.buttons{
    margin-top:25px;
    display:flex;
    gap:15px;
}

</style>

</head>

<body>

<div class="container">

<h1>Edit Lead</h1>

<form method="POST">

    {% csrf_token %}

    {% for field in form %}

        {% if field.name != "assigned_to" or request.user.is_superuser %}

        <div class="form-group">

            {{ field.label_tag }}

            {{ field }}

            {% if field.errors %}
                <div style="color:red; margin-top:5px;">
                    {{ field.errors }}
                </div>
            {% endif %}

        </div>

        {% endif %}

    {% endfor %}

    <div class="buttons">

        <button type="submit">
            Save Changes
        </button>

        <a href="{% url 'lead_detail' lead.id %}" class="cancel">
            Cancel
        </a>

    </div>

</form>

</div>

</body>

</html>
