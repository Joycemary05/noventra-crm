<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Import Excel - LeadFlow CRM</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f3f8;
}

.container{
    width:550px;
    margin:60px auto;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

h1{
    color:#6b4c8a;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:25px;
}

input[type=file]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    justify-content:flex-end;
    gap:12px;
}

button{
    background:#6b4c8a;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

a{
    background:#ddd;
    color:black;
    text-decoration:none;
    padding:12px 22px;
    border-radius:8px;
}

button:hover{
    background:#5a3d77;
}

</style>

</head>

<body>

<div class="container">

<h1>Import Leads</h1>

<p>Select an Excel (.xlsx) file to import leads.</p>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<input
type="file"
name="excel_file"
accept=".xlsx"
required>

<div class="buttons">

<a href="{% url 'leads_list' %}">
Cancel
</a>

<button type="submit">
Import
</button>

</div>

</form>

</div>

</body>

</html>
