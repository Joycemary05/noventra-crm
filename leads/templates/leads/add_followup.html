<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noventra | Add Follow-up</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter",Arial,sans-serif;
}


body{

    background:#f7f5fb;
    color:#2d2d35;

}


/* NAVBAR */

.navbar{

    height:75px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 45px;
    border-bottom:1px solid #eee;

}


.logo{

    font-size:28px;
    font-weight:800;
    color:#6b4c8a;

}


.nav-links a{

    text-decoration:none;
    color:#555;
    margin-left:20px;
    font-weight:600;

}


.nav-links a:hover{

    color:#6b4c8a;

}



/* CONTAINER */


.container{

    max-width:800px;
    margin:40px auto;
    padding:20px;

}


/* CARD */


.card{

    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);

    animation:fade .6s ease;

}



@keyframes fade{

from{

    opacity:0;
    transform:translateY(25px);

}

to{

    opacity:1;
    transform:translateY(0);

}

}



h1{

    font-size:32px;
    margin-bottom:10px;

}



.subtitle{

    color:#777;
    margin-bottom:30px;

}



/* FORM */


.form-group{

    margin-bottom:22px;

}



label{

    display:block;
    margin-bottom:8px;
    font-weight:700;

}


input,
textarea{

    width:100%;
    padding:14px;

    border:1px solid #ddd;

    border-radius:12px;

    font-size:15px;

    outline:none;

    transition:.3s;

}



input:focus,
textarea:focus{

    border-color:#6b4c8a;

    box-shadow:0 0 0 3px rgba(107,76,138,.15);

}



textarea{

    resize:none;

}



/* BUTTONS */


.actions{

    display:flex;
    gap:15px;
    margin-top:30px;

}



.btn{

    padding:13px 22px;
    border-radius:12px;
    text-decoration:none;
    font-weight:700;
    border:none;
    cursor:pointer;

}



.save{

    background:#6b4c8a;
    color:white;

}



.save:hover{

    background:#573b73;

}



.cancel{

    background:#eee;
    color:#555;

}



.cancel:hover{

    background:#ddd;

}



@media(max-width:600px){


.navbar{

    padding:20px;

}


.card{

    padding:25px;

}


.actions{

    flex-direction:column;

}


}


</style>

</head>


<body>


<nav class="navbar">


<div class="logo">

Noventra

</div>


<div class="nav-links">

<a href="{% url 'dashboard' %}">
Dashboard
</a>


<a href="{% url 'leads_list' %}">
Leads
</a>


</div>


</nav>



<main class="container">


<section class="card">


<h1>
Add Follow-up
</h1>


<p class="subtitle">

Create a follow-up reminder for 
<strong>{{ lead.name }}</strong>

</p>



<form method="POST">


{% csrf_token %}



<div class="form-group">


<label>
Follow-up Date
</label>


<input 
type="date"
name="follow_up_date"
required>


</div>



<div class="form-group">


<label>
Notes
</label>


<textarea
name="note"
rows="5"
placeholder="Enter follow-up details..."
required></textarea>


</div>



<div class="actions">


<button 
type="submit"
class="btn save">

Save Follow-up

</button>



<a href="{% url 'lead_detail' lead.id %}" 
class="btn cancel">

Cancel

</a>


</div>


</form>



</section>


</main>


</body>

</html>
