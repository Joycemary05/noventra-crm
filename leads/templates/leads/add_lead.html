<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noventra | Add Lead</title>


<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter", Arial, sans-serif;

}


body{

    background:#f7f5fb;

    color:#2d2d35;

}



/* NAVBAR */


.navbar{

    height:75px;

    background:white;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 45px;

    border-bottom:1px solid #eee;

    position:sticky;

    top:0;

    z-index:100;

}



.logo{

    font-size:28px;

    font-weight:800;

    color:#6b4c8a;

}



.nav-links{

    display:flex;

    gap:10px;

}



.nav-links a{

    text-decoration:none;

    color:#555;

    padding:10px 16px;

    border-radius:10px;

    font-weight:600;

    transition:.3s;

}



.nav-links a:hover{

    background:#f0eafa;

    color:#6b4c8a;

    transform:translateY(-2px);

}



.active-link{

    background:#f0eafa;

    color:#6b4c8a !important;

}



/* CONTAINER */


.container{

    max-width:900px;

    margin:45px auto;

    padding:0 25px;

}



/* FORM CARD */


.card{

    background:white;

    padding:40px;

    border-radius:24px;

    box-shadow:0 10px 35px rgba(0,0,0,.07);

    animation:fadeUp .6s ease;

}



@keyframes fadeUp{


from{

    opacity:0;

    transform:translateY(25px);

}


to{

    opacity:1;

    transform:translateY(0);

}


}



h1{

    font-size:32px;

    font-weight:800;

    margin-bottom:10px;

}



.subtitle{

    color:#777;

    margin-bottom:35px;

}



/* FORM */


.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}



.form-group{

    margin-bottom:20px;

}



.full-width{

    grid-column:1 / -1;

}



label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

    color:#555;

}



input,
select,
textarea{


    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:12px;

    font-size:15px;

    outline:none;

    transition:.3s;

}



input:focus,
select:focus,
textarea:focus{


    border-color:#6b4c8a;

    box-shadow:0 0 0 4px rgba(107,76,138,.12);

}



textarea{

    resize:vertical;

}



/* BUTTONS */


.actions{

    display:flex;

    gap:15px;

    margin-top:30px;

}



.btn{

    padding:13px 25px;

    border-radius:12px;

    text-decoration:none;

    font-weight:700;

    border:none;

    cursor:pointer;

    transition:.3s;

}



.save{

    background:#6b4c8a;

    color:white;

}



.save:hover{

    background:#563b70;

    transform:translateY(-3px);

}



.cancel{

    background:#eee;

    color:#555;

}



.cancel:hover{

    background:#ddd;

}





@media(max-width:700px){


.navbar{

    flex-direction:column;

    height:auto;

    gap:15px;

    padding:20px;

}



.form-grid{

    grid-template-columns:1fr;

}



.card{

    padding:25px;

}



}



</style>


</head>


<body>



<nav class="navbar">


<div class="logo">

    Noventra

</div>



<div class="nav-links">


<a href="{% url 'dashboard' %}">

Dashboard

</a>



<a href="{% url 'leads_list' %}">

Leads

</a>



<a href="{% url 'add_lead' %}" class="active-link">

Add Lead

</a>



<a href="{% url 'logout' %}">

Logout

</a>


</div>



</nav>
<main class="container">


<section class="card">


<h1>
Create New Lead
</h1>


<p class="subtitle">

Add a new customer relationship to Noventra.

</p>





<form method="POST">


{% csrf_token %}





<div class="form-grid">





<div class="form-group">


<label>
Name
</label>


<input

type="text"

name="name"

placeholder="Enter lead name"

required>

</div>






<div class="form-group">


<label>
Email
</label>


<input

type="email"

name="email"

placeholder="Enter email address"

required>


</div>






<div class="form-group">


<label>
Phone
</label>


<input

type="text"

name="phone"

placeholder="Enter phone number">


</div>






<div class="form-group">


<label>
Company
</label>


<input

type="text"

name="company"

placeholder="Enter company name">


</div>






<div class="form-group">


<label>
Source
</label>



<select name="source">


<option value="website">

Website

</option>



<option value="linkedin">

LinkedIn

</option>



<option value="instagram">

Instagram

</option>



<option value="referral">

Referral

</option>



<option value="other">

Other

</option>



</select>


</div>






<div class="form-group">


<label>
Status
</label>



<select name="status">


<option value="new">

New

</option>



<option value="contacted">

Contacted

</option>



<option value="converted">

Converted

</option>



</select>


</div>







{% if request.user.is_superuser %}


<div class="form-group">


<label>
Assign To
</label>


<select name="assigned_to">


<option value="">

Select User

</option>




{% for user in users %}



<option value="{{ user.id }}">

{{ user.username }}

</option>



{% endfor %}



</select>


</div>


{% endif %}






<div class="form-group full-width">


<label>
Message
</label>



<textarea

name="message"

rows="5"

placeholder="Enter any message or notes about this lead..."></textarea>


</div>





</div>






<div class="actions">


<button

type="submit"

class="btn save">

Save Lead

</button>





<a

href="{% url 'leads_list' %}"

class="btn cancel">

Cancel

</a>



</div>





</form>



</section>



</main>



</body>

</html>
