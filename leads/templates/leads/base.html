{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Noventra CRM{% endblock %}</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{

--primary:#6B4CFF;
--primary-dark:#5A3BFF;
--primary-light:#8C74FF;

--bg:#F7F8FC;
--card:#FFFFFF;
--border:#ECEEF6;

--text:#1F2937;
--muted:#7B8794;

--success:#22C55E;
--danger:#EF4444;
--warning:#F59E0B;

--shadow:0 8px 30px rgba(0,0,0,.06);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

a{
text-decoration:none;
color:inherit;
}

button{
border:none;
outline:none;
cursor:pointer;
font-family:inherit;
}

img{
display:block;
max-width:100%;
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#D7DAE8;
border-radius:50px;
}

.navbar{

position:fixed;

top:0;
left:0;

width:100%;
height:74px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 38px;

background:rgba(255,255,255,.75);

backdrop-filter:blur(20px);

border-bottom:1px solid rgba(0,0,0,.05);

z-index:1000;

}

.logo{

font-size:28px;
font-weight:800;
color:var(--primary);

}

.desktop-menu{

display:flex;
align-items:center;
gap:12px;

}

.desktop-menu a{

padding:12px 18px;
border-radius:14px;
font-weight:600;
transition:.35s;

}

.desktop-menu a:hover{

background:#F3F0FF;
color:var(--primary);

}

.logout{

color:#E53935;

}

.logout:hover{

background:#FFEAEA;

}

.menu-btn{

display:none;

width:46px;
height:46px;

background:none;

font-size:30px;

color:var(--primary);

}

.sidebar{

position:fixed;

top:0;
left:-320px;

width:300px;
height:100vh;

background:rgba(255,255,255,.94);

backdrop-filter:blur(24px);

box-shadow:var(--shadow);

transition:.35s;

z-index:1200;

display:flex;
flex-direction:column;

padding:28px;

}

.sidebar.active{

left:0;

}

.sidebar-header{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:40px;

}

.sidebar-logo{

font-size:30px;
font-weight:800;
color:var(--primary);

}

.close-btn{

width:42px;
height:42px;

border-radius:12px;

background:#F4F5FA;

font-size:22px;

}

.sidebar nav{

display:flex;
flex-direction:column;
gap:12px;

}

.sidebar nav a{

padding:15px 18px;
border-radius:14px;
font-weight:600;
transition:.35s;

}

.sidebar nav a:hover{

background:#F3F0FF;
color:var(--primary);
transform:translateX(6px);

}

.overlay{

position:fixed;
inset:0;

background:rgba(0,0,0,.35);

opacity:0;
visibility:hidden;

transition:.35s;

z-index:1100;

}

.overlay.active{

opacity:1;
visibility:visible;

}

.page-content{

padding:105px 35px 35px;
min-height:100vh;

}

@media(max-width:900px){

.desktop-menu{
display:none;
}

.menu-btn{
display:flex;
align-items:center;
justify-content:center;
}

.navbar{
padding:0 20px;
}

.page-content{
padding:90px 18px 25px;
}

}

@media(max-width:600px){

.sidebar{
width:270px;
}

.logo{
font-size:24px;
}

.page-content{
padding:88px 14px 20px;
}

}

</style>

{% block extra_css %}
{% endblock %}

</head>
<body>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <div class="sidebar-logo">
            Noventra
        </div>

        <button class="close-btn" id="closeBtn">
            ✕
        </button>

    </div>

    <nav>

        <a href="{% url 'dashboard' %}">Dashboard</a>

        <a href="{% url 'leads_list' %}">Leads</a>

        <a href="{% url 'add_lead' %}">Add Lead</a>

        <a href="{% url 'logout' %}" class="logout">Logout</a>

    </nav>

</aside>

<header class="navbar">

    <button class="menu-btn" id="menuBtn">
        ☰
    </button>

    <div class="logo">
        Noventra
    </div>

    <nav class="desktop-menu">

        <a href="{% url 'dashboard' %}">Dashboard</a>

        <a href="{% url 'leads_list' %}">Leads</a>

        <a href="{% url 'add_lead' %}">Add Lead</a>

        <a href="{% url 'logout' %}" class="logout">Logout</a>

    </nav>

</header>

<main class="page-content">

{% block content %}
{% endblock %}

</main>

<style>

.page-content{
    animation:pageEnter .6s ease;
}

@keyframes pageEnter{

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.glass-card{

background:rgba(255,255,255,.75);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.5);

box-shadow:0 20px 50px rgba(0,0,0,.06);

border-radius:24px;

}

.btn-primary{

background:linear-gradient(
135deg,
var(--primary),
var(--primary-light)
);

color:white;

padding:13px 24px;

border-radius:14px;

font-weight:600;

display:inline-flex;

align-items:center;

justify-content:center;

gap:8px;

transition:.35s;

}

.btn-primary:hover{

transform:translateY(-3px);

box-shadow:0 15px 30px rgba(107,76,255,.25);

}

.float{

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}

.fade-in{

animation:fade .7s ease;

}

@keyframes fade{

from{
opacity:0;
transform:scale(.96);
}

to{
opacity:1;
transform:scale(1);
}

}

.table-container{

overflow-x:auto;

}

</style>
<script>

document.addEventListener("DOMContentLoaded", function () {

    const menuBtn = document.getElementById("menuBtn");
    const closeBtn = document.getElementById("closeBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    if (menuBtn && closeBtn && sidebar && overlay) {

        menuBtn.addEventListener("click", function () {
            sidebar.classList.add("active");
            overlay.classList.add("active");
        });

        closeBtn.addEventListener("click", function () {
            sidebar.classList.remove("active");
            overlay.classList.remove("active");
        });

        overlay.addEventListener("click", function () {
            sidebar.classList.remove("active");
            overlay.classList.remove("active");
        });

        document.querySelectorAll(".sidebar nav a").forEach(function(link) {
            link.addEventListener("click", function() {
                sidebar.classList.remove("active");
                overlay.classList.remove("active");
            });
        });

    }

});

</script>

{% block scripts %}
{% endblock %}

</body>
</html>
